name: Windows 16kHz NVDA add-on (feature experiment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 python3 zip gdb

      - name: Apply the built-in English pronunciation dictionary
        run: |
          set -eux
          python3 tools/rules/consts.py enus
          EVV_NOTATION_LANG=enus python3 tools/rules/notation.py build > /dev/null
          python3 tools/module/dict.py build

      - name: Smoke-test Finnish and Brazilian Portuguese language switching
        run: |
          set -eux
          LANGS="lang/enus lang/fifi lang/ptbr"
          make so RULES=bytecode EVVPLAIN=1 LANGS="$LANGS" -j2
          gdb --batch -ex 'set breakpoint pending on' -ex 'break vinitloc_new if loc->kind >= 0' -ex run -ex 'p *loc' -ex bt --args python3 -u test/lib/switchlangs.py build/libeci.so
          gdb --return-child-result --batch -ex run -ex bt --args python3 -u test/lib/switchlangs.py build/libeci.so

      - name: Build 64-bit bytecode engine with all 12 languages
        run: |
          set -eux
          LANGS="lang/enus lang/engb lang/eses lang/esus lang/dede lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/fifi lang/ptbr"
          make build/eci.dll RULES=bytecode LANGS="$LANGS" -j2
          ls -lh build/eci.dll

      - name: Build 32-bit bytecode engine with all 12 languages
        run: |
          set -eux
          LANGS="lang/enus lang/engb lang/eses lang/esus lang/dede lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/fifi lang/ptbr"
          make build/eci32.dll RULES=bytecode LANGS="$LANGS" -j2
          ls -lh build/eci32.dll

      - name: Package NVDA add-on 1.3.7
        run: |
          mkdir -p out
          python3 nvda/build.py --version 1.3.7 --out out
          ls -lh out/openevv-1.3.7.nvda-addon

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevv-1.3.7-nvda-addon-vowel-experiment
          path: out/openevv-1.3.7.nvda-addon
          if-no-files-found: error
          retention-days: 14
