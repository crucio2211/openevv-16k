name: Windows 16kHz DLLs (all languages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout tree (patches already migrated in)
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 python3 zip gdb

      - name: Apply the built-in English pronunciation dictionary
        run: |
          set -eux
          # Rebuild the US dictionary only when its editable source changed.
          # The generated dictionary tables are committed after a successful
          # build; rebuilding them on unrelated settings commits is not
          # idempotent because the source and generated table names then differ.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          if ! git diff --quiet "$BASE" HEAD -- lang/enus/enus.dict; then
            # The Apple 6.1 dispatch rules replace several lower IBM switches,
            # so dictionary edits are applied against the lower dispatch first.
            EVV_NOTATION_LANG=enus python3 tools/rules/notation.py rewrite
            EVV_LANG_DIR=lang/enus python3 tools/module/dict.py build
          else
            echo "US dictionary source unchanged; keeping committed dictionary tables."
          fi
          # Regenerate every runtime table from the authored Apple US data.
          # The text tables changed with the Apple import; stale generated C
          # tables can corrupt set/global initialization at runtime.
          make tables-write TAGS="enus"
          # Keep generated runtime tables committed so local builds and CI
          # use the same Apple US language data.
          git add lang/enus/delta_globals_enus.c \
                  lang/enus/eci_ini_enus.c \
                  lang/enus/delta_link_enus.c \
                  lang/enus/delta_sets_enus.c \
                  lang/enus/delta_authored_enus.c
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Apple US runtime tables"
            git push origin HEAD:main
          fi
          # Remove stale generated rule C so the authored Apple rules compile.
          rm -f lang/enus/delta_rules_enus.c \
                lang/enus/delta_rules_enus.h \
                lang/enus/delta_rules_shim_enus.c
          make rulecode LANGS="lang/enus"

      - name: Smoke-test US English, Finnish and Brazilian Portuguese speech
        run: |
          set -eux
          LANGS="lang/enus lang/fifi lang/ptbr"
          make so RULES=c EVVPLAIN=1 LANGS="$LANGS" -j2
          if ! python3 -u test/lib/switchlangs.py build/libeci.so; then
            echo "Language smoke test failed; rerunning under GDB for diagnostics."
            gdb --batch -ex run -ex "thread apply all bt full" --args python3 -u test/lib/switchlangs.py build/libeci.so || true
            exit 1
          fi

      - name: Build eci.dll 64-bit (RULES=c, all languages)
        run: |
          set -eux
          LANGS="lang/enus lang/engb lang/eses lang/esus lang/dede lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/fifi lang/ptbr"
          make build/eci.dll RULES=c LANGS="$LANGS" -j2
          ls -la build/eci.dll

      - name: Build eci32.dll 32-bit (RULES=c, all languages)
        run: |
          set -eux
          LANGS="lang/enus lang/engb lang/eses lang/esus lang/dede lang/frfr lang/frca lang/itit lang/plpl lang/jajp lang/fifi lang/ptbr"
          make build/eci32.dll RULES=c LANGS="$LANGS" -j2
          ls -la build/eci32.dll

      - name: Package NVDA add-on
        run: |
          set -eux
          VERSION="1.3.7-main-${GITHUB_SHA::7}"
          python3 nvda/build.py --version "$VERSION"
          ls -lh build/openevv-${VERSION}.nvda-addon

      - name: Upload NVDA add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: openevv-nvda-addon-main-${{ github.sha }}
          path: build/openevv-1.3.7-main-*.nvda-addon
          if-no-files-found: error
          retention-days: 30

      - name: Zip DLLs
        run: |
          mkdir -p out
          cp build/eci.dll build/eci32.dll out/
          cd out && zip -9 openevv-16k-dlls.zip eci.dll eci32.dll
          ls -la

      - name: Upload as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-16k-${{ github.run_number }}
          name: OpenEVV 16kHz custom (run ${{ github.run_number }})
          body: |
            Custom 16kHz RULES=c build, all 12 languages (incl. Japanese, Finnish, Brazilian Portuguese):
            - automatic wideband companion above 16 kHz (8-formant upper band, partner-paced at 22.05 kHz)
            - hetero: quality, persona, address (+ plurals)
            - punct: bare marks removed from eng_char_name
            - poor/poors phones fixed
            - 0.20.0 driver set (boost, dicts, IBMTTS fixes, PIECE_CAP=20)
            Files: eci.dll (64-bit), eci32.dll (32-bit)
          files: out/openevv-16k-dlls.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
