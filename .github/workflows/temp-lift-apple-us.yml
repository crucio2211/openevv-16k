name: Temporary Apple ECI 6.1 US module lift

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-lift-apple-us.yml

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
      - name: Download Apple US module and lift all 6.1 language sources
        env:
          APPLE_SOURCE_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-70e0-8207-9a3d-274afeccba4b/raw?se=2026-11-04T17%3A29%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d09ba1e4-2bff-518b-a4a5-ed1a7bf44f2d&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T05%3A40%3A16Z&ske=2026-11-05T05%3A40%3A16Z&sks=b&skv=2026-02-06&sig=ix40lkagTj%2BFpo9wrEvCFdLPlT8tmMGFoLw495dEHNY%3D"
        run: |
          set -euo pipefail
          mkdir -p /tmp/apple-source
          curl --fail --location --retry 2 "$APPLE_SOURCE_URL" -o /tmp/apple-source/apple-modules.zip
          unzip -q /tmp/apple-source/apple-modules.zip -d /tmp/apple-source
          ENU=$(find /tmp/apple-source -type f -name enu.dylib -print -quit)
          test -n "$ENU"
          python3 - "$ENU" /tmp/apple-source/enu-x86_64.dylib <<'PY'
          import pathlib, struct, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if raw[:4] == bytes.fromhex("cafebabe"):
              n = struct.unpack_from(">I", raw, 4)[0]
              for i in range(n):
                  cpu, subtype, offset, size, align = struct.unpack_from(">IIIII", raw, 8 + 20*i)
                  if cpu == 0x01000007:
                      pathlib.Path(sys.argv[2]).write_bytes(raw[offset:offset+size])
                      break
              else:
                  raise SystemExit("no x86_64 slice in Apple US module")
          elif raw[:4] == bytes.fromhex("cffaedfe"):
              pathlib.Path(sys.argv[2]).write_bytes(raw)
          else:
              raise SystemExit("unrecognized Apple module format")
          PY
          git fetch origin tmp/lift64-apple-fixes-20261105
          git checkout FETCH_HEAD -- tools/rules/lift64.py
          python3 - <<'PY'
          p = "tools/module/lift61.py"
          s = open(p, encoding="utf-8").read()
          old = 'LANG_NUMBERS = {"fifi": (9, 0, "Static Engine FIN"),'
          new = 'LANG_NUMBERS = {"enus": (1, 0, "Static Engine ENU"),\n                "fifi": (9, 0, "Static Engine FIN"),'
          assert old in s
          open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          PY
          {
            echo "=== Apple ECI 6.1 enu.dylib ==="
            python3 tools/module/lift61.py /tmp/apple-source/enu-x86_64.dylib enus globals
            python3 tools/module/lift61.py /tmp/apple-source/enu-x86_64.dylib enus statements
            python3 tools/module/lift61.py /tmp/apple-source/enu-x86_64.dylib enus sets
            python3 tools/module/lift61.py /tmp/apple-source/enu-x86_64.dylib enus rules
            python3 tools/module/lift61.py /tmp/apple-source/enu-x86_64.dylib enus settings
            python3 tools/rules/lift64.py census /tmp/apple-source/enu-x86_64.dylib || true
          } 2>&1 | tee /tmp/apple-source/lift-report.txt
          git checkout -b tmp/apple-eci61-us-lift-v3-20261105
          git rm .github/workflows/temp-lift-apple-us.yml
          git config user.name "OpenEVV Apple 6.1 Lift"
          git config user.email "actions@users.noreply.github.com"
          git add lang/enus
          git commit -m "Port Apple ECI 6.1 US English module sources"
          git push origin HEAD:tmp/apple-eci61-us-lift-v2-20261105
          echo "Generated Apple US module committed to tmp/apple-eci61-us-lift-v2-20261105"
