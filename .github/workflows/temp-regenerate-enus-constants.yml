name: Temporary regenerate US authored rule constants

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-regenerate-enus-constants.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate US authored constants and symbol map
        run: |
          set -euxo pipefail
          python3 tools/rules/consts.py enus
          grep -Fqx 'at * eti_s_1b9000 enus_evv_authored_data 52' lang/enus/rules/symbols
          grep -q 'eti_s_1b9000' lang/enus/delta_authored_enus.c
          wc -l -c lang/enus/rules/symbols lang/enus/delta_authored_enus.c
      - name: Commit generated US files
        run: |
          set -euxo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lang/enus/rules/symbols lang/enus/delta_authored_enus.c
          if git diff --cached --quiet; then
            echo "Generated US constants already up to date"
            exit 0
          fi
          git commit -m "Generate Apple US authored rule constants"
          git push
