name: Temporary Open EVV US rule export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-export-openevv-us.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export all US English rule sources
        run: |
          mkdir -p export
          cp -a lang/enus/rules export/rules
          cp -a lang/enus/*.dict export/ 2>/dev/null || true
          cp -a lang/enus/*.settings export/ 2>/dev/null || true
          cp Makefile export/Makefile
          cp tools/rules/notation.py export/notation.py
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS
          tar -czf openevv-us-source.tar.gz -C export .
          sha256sum openevv-us-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-openevv-us-source
          path: openevv-us-source.tar.gz
          retention-days: 1
